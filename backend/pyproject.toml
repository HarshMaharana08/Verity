[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "verity-backend"
version = "0.1.0"
description = "Verity — Pharma Quality Investigator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["verity*"]