[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "verity-backend"
version = "0.1.0"
description = "Verity — Pharma Quality Investigator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "pypdf>=6.0,<7.0",
    "groq>=1.7,<2.0",
    "tiktoken>=0.14,<1.0",
    "langgraph>=1.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["verity*"]
